<h2 class="mb-3">Paquetes turísticos</h2>

<div class="row g-2 mb-3">
  <div class="col-12 col-md-7">
    <input #buscador type="text" class="form-control"
           placeholder="Buscar por destino o descripción..."
           [value]="busqueda()"
           (input)="busqueda.set(buscador.value)">
  </div>
  <div class="col-8 col-md-3">
    <select #selector class="form-select"
            [value]="categoria()"
            (change)="categoria.set(selector.value)">
      @for (c of categorias; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>
  <div class="col-4 col-md-2">
    <button class="btn btn-outline-secondary w-100" (click)="limpiarFiltros()">Limpiar</button>
  </div>
</div>

<p class="text-muted small">
  Mostrando {{ paquetesFiltrados().length }} de {{ paquetes().length }} paquetes
</p>

@if (paquetesFiltrados().length === 0) {
  <div class="alert alert-warning">No se encontraron paquetes con esos criterios.</div>
}

<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
  @for (p of paquetesFiltrados(); track p.id) {
    <div class="col">
      <app-paquete-card [paquete]="p" (reservar)="irAReservar($event)" />
    </div>
  }
</div>
